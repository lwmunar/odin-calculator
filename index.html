<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP's Project: Calculator</title>

    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div class="container">
        <h1>Look a calculator!</h1>
        <div class="calculator">
            <div class="display"></div>
            <div class="numbers">
                <button class="num1">1</button>
                <button class="num2">2</button>
                <button class="num3">3</button>
                <button class="num4">4</button>
                <button class="num5">5</button>
                <button class="num6">6</button>
                <button class="num7">7</button>
                <button class="num8">8</button>
                <button class="num9">9</button>
                <button class="num0">0</button>
                <button class="opDec">.</button>
            </div>
            <div class="operation">
                <button class="opAdd">+</button>
                <button class="opSub">-</button>
                <button class="opMul">*</button>
                <button class="opDiv">/</button>
                <button class="opRes">=</button>
            </div>
            <div class="remove">
                <button class="delete">Del</button>
                <button class="clear">Clear</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
